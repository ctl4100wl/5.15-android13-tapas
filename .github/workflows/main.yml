name: Build ChicKernel (KSUN / KSUN+SuSFS)

on:
  workflow_dispatch:
  push:
    branches:
      - kernel-ksun-susfs

permissions:
  contents: read

concurrency:
  group: chickernel-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        target:
          - chickernel_ksun
          - chickernel_ksun_susfs

    env:
      BAZEL_DISK_CACHE: ${{ github.workspace }}/.bazel-disk-cache
      BAZEL_OUTPUT_ROOT: /home/runner/.cache/chickernel-bazel-output
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "3"
      CCACHE_SLOPPINESS: time_macros
      USE_CCACHE: "0"

    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ============================================================
      # 1. FREE DISK SPACE
      # ============================================================

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          sudo docker image prune -af || true

          echo "=== Disk space ==="
          df -h /

      # ============================================================
      # 2. SWAP
      # ============================================================

      - name: Add 16GB swap
        shell: bash
        run: |
          sudo swapoff -a || true

          sudo fallocate -l 16G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

          echo "=== Memory ==="
          free -h

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            python3 \
            ccache \
            rsync \
            unzip \
            zip \
            zstd \
            lz4 \
            libssl-dev \
            libelf-dev \
            bc \
            bison \
            flex \
            build-essential

          echo "=== ccache version ==="
          ccache --version

      # ============================================================
      # 4. INSTALL REPO
      # ============================================================

      - name: Install repo
        shell: bash
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          git config --global user.name ci
          git config --global user.email ci@localhost

      # ============================================================
      # 5. SYNC ACK SOURCE
      # ============================================================

      - name: Sync ACK build environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/ack"
          cd "$HOME/ack"

          curl -fsSL \
            https://raw.githubusercontent.com/ChicKernel/device_xiaomi_gemstones-kernel/readme/chickernel.xml \
            -o chickernel.xml

          sed -i \
            "s#<remote name=\"common-repo\" fetch=\"[^\"]*\"/>#<remote name=\"common-repo\" fetch=\"https://github.com/${GITHUB_REPOSITORY_OWNER}/\"/>#" \
            chickernel.xml

          sed -i \
            "s#name=\"device_xiaomi_gemstones-kernel\" remote=\"common-repo\" revision=\"[^\"]*\"#name=\"${GITHUB_REPOSITORY#*/}\" remote=\"common-repo\" revision=\"${GITHUB_REF_NAME}\"#" \
            chickernel.xml

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -m "$(pwd)/chickernel.xml" \
            --depth=1

          repo sync \
            -c \
            -j"$(nproc)" \
            --no-tags \
            --fetch-submodules

      # ============================================================
      # 6. FULL KSU HISTORY
      # ============================================================

      - name: Full-history KernelSU submodules
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOME/ack/common"

          git submodule update --init --recursive

          for s in KernelSU-Next KernelSU-Next-SuSFS; do
            if [ -d "$s/.git" ] || [ -f "$s/.git" ]; then

              git -C "$s" fetch --unshallow 2>/dev/null || true

              COUNT=$(git -C "$s" rev-list --count HEAD)
              VERSION=$((30000 + COUNT))

              echo "$s:"
              echo "  Commits: $COUNT"
              echo "  KSU_VERSION: $VERSION"

            else
              echo "Skipping missing submodule: $s"
            fi
          done

      # ============================================================
      # 7. BAZEL CACHE
      # ============================================================

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            bazel-v1-${{ runner.os }}-${{ matrix.target }}-
            bazel-v1-${{ runner.os }}-

      # ============================================================
      # 8. CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ matrix.target }}-
            ccache-v1-${{ runner.os }}-

      - name: Configure caches
        shell: bash
        run: |
          mkdir -p "$BAZEL_DISK_CACHE"
          mkdir -p "$BAZEL_OUTPUT_ROOT"
          mkdir -p "$CCACHE_DIR"

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          ccache --zero-stats

          echo "=== Cache configuration ==="
          ccache --show-config | grep -E \
            'cache_dir|max_size|compression' || true

          echo ""
          echo "Bazel disk cache: $BAZEL_DISK_CACHE"
          echo "Bazel output root: $BAZEL_OUTPUT_ROOT"

          echo ""
          echo "Note: ccache requires Bazel compiler integration."
          echo "Bazel disk cache is enabled independently."

      # ============================================================
      # 9. BUILD
      # ============================================================

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOME/ack"

          echo "========================================"
          echo " Building: ${{ matrix.target }}"
          echo "========================================"

          tools/bazel \
            --output_user_root="$BAZEL_OUTPUT_ROOT" \
            build \
            --disk_cache="$BAZEL_DISK_CACHE" \
            //common:${{ matrix.target }}

      # ============================================================
      # 10. VERSION CHECK
      # ============================================================

      - name: Package AnyKernel3
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            chickernel_ksun) variant=KSUN ;;
            chickernel_ksun_susfs) variant=KSUN-SuSFS ;;
            *) exit 1 ;;
          esac
          bash "$GITHUB_WORKSPACE/scripts/package-anykernel3.sh" \
            "$HOME/ack/bazel-bin/common/$TARGET/Image" \
            "$variant" "$GITHUB_WORKSPACE/artifacts"

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-AnyKernel3
          path: |
            artifacts/ChicKernel-*-AnyKernel3.zip
            artifacts/ChicKernel-*-AnyKernel3.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Check KSU version and SuSFS
        if: success()
        shell: bash
        run: |
          cd "$HOME/ack"

          echo "=== KernelSU / SuSFS version ==="

          grep -rh \
            "KernelSU-Next version\|SUSFS_VERSION" \
            bazel-out/ 2>/dev/null \
            | sort -u \
            | head -30 || true

      # ============================================================
      # 11. CACHE STATISTICS
      # ============================================================

      - name: Cache statistics
        if: always()
        shell: bash
        run: |
          echo "=== Bazel cache size ==="

          du -sh "$BAZEL_DISK_CACHE" 2>/dev/null || true

          echo ""
          echo "=== ccache statistics ==="

          ccache --show-stats || true

          echo ""
          echo "=== Disk space ==="

          df -h /

      # ============================================================
      # 12. UPLOAD KERNEL IMAGE
      # ============================================================

      - name: Upload Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-Image
          path: /home/runner/ack/bazel-bin/common/${{ matrix.target }}/Image
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

      # ============================================================
      # 13. SAVE BAZEL CACHE
      # ============================================================

      - name: Save Bazel disk cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}

      # ============================================================
      # 14. SAVE CCACHE
      # ============================================================

      - name: Save ccache
        if: success() && env.USE_CCACHE == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}
